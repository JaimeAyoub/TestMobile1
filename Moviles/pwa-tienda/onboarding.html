<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil - 皮膚屋 (Tienda de Skins)</title>
  
  <meta name="theme-color" content="#12161f">
  
  <!-- Tipografías de inspiración japonesa -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <div class="auth-container">
    <header class="shop-header">
      <span class="kanji-subtitle">登録 (REGISTRO)</span>
      <h1>TU PERFIL</h1>
      <div class="header-divider"></div>
    </header>

    <div class="auth-form">
      <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 5px;">¿Bajo qué nombre se te conocerá?</p>
      
      <input type="text" id="nameInput" class="auth-input" placeholder="Nombre o Apodo" autocomplete="off">
      
      <div class="login-actions">
        <button id="saveProfileBtn" class="auth-btn primary">Entrar a la tienda</button>
      </div>

      <!-- Añadimos esto para mostrar errores sin usar el "alert" molesto del navegador -->
      <p id="statusMsg" class="status-msg"></p>
    </div>
  </div>

  <!-- Scripts de Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  
  <script type="module" src="onboarding.js"></script>
</body>
</html>
