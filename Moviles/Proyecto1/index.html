<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Tasks</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
</head>

<body>


  <div class="app">
    <header class="app-header">
      <button id="installBtn" class="install-btn" hidden>Install App</button>
      <h1>Campus Tasks</h1>
      <p class="subtitle">A tiny modular task tracker</p>
    </header>

    <form id="taskForm" class="task-form">
      <input type="text" id="taskInput" placeholder="What do you need to do?" autocomplete="off" required>
      <button type="submit">Add</button>

    </form>

    <!-- Cosas de LogIn  -->
    <form id="LogIn" class="log-in">
      <div class="log-in-fields">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password (min 6 characters)">
      </div>

      <div class="log-in-actions">
        <button id="btnSignUp" type="button">Sign Up</button>
        <button id="btnLogIn" type="button">Log In</button>

      </div>
    <form id="LogOut" class="log-in"></form>
      <div class="log-out-actions">
        <button id="btnLogOut" type="button">Log Out</button>
      </div>

      <div id="status">Not logged in.</div>
    </form>
    <!--------------->
    <ul id="taskList" class="task-list"></ul>

    <p id="emptyState" class="empty-state">No tasks yet — add your first one above.</p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script src="js/firebase_init.js"></script>


  <script src="js/login.js"></script>

  <!-- type="module" lets us use import/export between files -->
  <script type="module" src="js/app.js">

  </script>
</body>

</html>
