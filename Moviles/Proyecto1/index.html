
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Tasks</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="app">
    <header class="app-header">
      <h1>Campus Tasks</h1>
      <p class="subtitle">A tiny modular task tracker</p>
    </header>

    <form id="taskForm" class="task-form">
      <input
        type="text"
        id="taskInput"
        placeholder="What do you need to do?"
        autocomplete="off"
        required
      >
      <button type="submit">Add</button> 
      

    </form>

    <ul id="taskList" class="task-list"></ul>

    <p id="emptyState" class="empty-state">No tasks yet — add your first one above.</p>
  </div>

  <!-- type="module" lets us use import/export between files -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
